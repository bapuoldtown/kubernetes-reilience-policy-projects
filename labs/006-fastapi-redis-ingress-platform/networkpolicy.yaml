apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: payment-api-allow-approved
  namespace: mission-006
spec:
  podSelector:
    matchLabels:
      app: payment-api
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          access: approved
    ports:
    - protocol: TCP
      port: 8000
