apiVersion: v1
kind: ConfigMap
metadata:
  name: envoy-config
  namespace: mission-006
data:
  envoy.yaml: |
    static_resources:
      listeners:
      - name: http_listener
        address:
          socket_address:
            address: 0.0.0.0
            port_value: 8080
        filter_chains:
        - filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: ingress_http
              route_config:
                name: local_route
                virtual_hosts:
                - name: payments
                  domains: ["payments.local"]
                  routes:
                  - match:
                      prefix: "/"
                    route:
                      cluster: payment_backend
              http_filters:
              - name: envoy.filters.http.router
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      clusters:
      - name: payment_backend
        connect_timeout: 2s
        type: STRICT_DNS
        lb_policy: ROUND_ROBIN
        load_assignment:
          cluster_name: payment_backend
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: payment-api.mission-006.svc.cluster.local
                    port_value: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: envoy-gateway
  namespace: mission-006
spec:
  replicas: 1
  selector:
    matchLabels:
      app: envoy-gateway
  template:
    metadata:
      labels:
        app: envoy-gateway
        access: approved
    spec:
      containers:
      - name: envoy
        image: envoyproxy/envoy:v1.33.2
        args: ["-c", "/etc/envoy/envoy.yaml"]
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: envoy-config
          mountPath: /etc/envoy
          readOnly: true
      volumes:
      - name: envoy-config
        configMap:
          name: envoy-config
